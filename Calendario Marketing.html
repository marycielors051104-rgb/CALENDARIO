<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Calendario Marketing</title>
<style>
:root{
  --bg:#ffffff;--surface:#f5f5f3;--card:#ffffff;--line:#e4e4e0;--ink:#161616;--muted:#6a6a66;
  --accent:#c6e03a;--on-accent:#141414;--accent-text:#667300;--accent-soft:#f1f7c9;--shadow:0 6px 20px rgba(0,0,0,.07);
}
:root[data-theme="dark"]{
  --bg:#0c0c0c;--surface:#151515;--card:#1b1b1b;--line:#2b2b2b;--ink:#f1f1ee;--muted:#8f8f8a;
  --accent:#c6e03a;--on-accent:#101010;--accent-text:#c6e03a;--accent-soft:#252a0f;--shadow:0 6px 20px rgba(0,0,0,.5);
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:14px/1.4 Inter,ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif}
.wrap{max-width:1300px;margin:0 auto;padding:24px 22px 60px}
.top{display:flex;justify-content:space-between;align-items:center;gap:14px;flex-wrap:wrap;margin-bottom:20px}
.brand{display:flex;align-items:center;gap:12px}
.logo{width:38px;height:38px;border-radius:10px;background:var(--accent);color:var(--on-accent);display:grid;place-items:center;font-weight:900;font-size:18px}
.brand h1{margin:0;font-size:22px;letter-spacing:-.4px}
.brand small{display:block;color:var(--muted);font-size:12px;margin-top:1px}
.actions{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.btn{appearance:none;border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:9px;padding:8px 13px;font:inherit;font-weight:600;cursor:pointer}
.btn:hover{border-color:var(--accent-text);color:var(--accent-text)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--on-accent);font-weight:800}
.btn.primary:hover{filter:brightness(.95);color:var(--on-accent)}
.btn.danger{color:#d9534f;border-color:#d9534f55}
.nav{display:flex;align-items:center;gap:10px;margin-bottom:14px;flex-wrap:wrap}
.nav h2{margin:0 8px;font-size:18px;text-transform:capitalize;min-width:150px;text-align:center}
.nav .count{margin-left:auto;color:var(--muted);font-size:12.5px}
.weekdays{display:grid;grid-template-columns:repeat(7,1fr);gap:8px;margin-bottom:6px}
.weekdays span{font-size:11px;font-weight:700;letter-spacing:.7px;text-transform:uppercase;color:var(--muted);text-align:center}
.grid{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:8px}
.day{min-height:128px;background:var(--surface);border:1px solid var(--line);border-radius:11px;padding:8px;display:flex;flex-direction:column;gap:6px;min-width:0}
.day.out{opacity:.38}
.day.today{border-color:var(--accent);box-shadow:0 0 0 1px var(--accent) inset}
.day.dragover{outline:2px dashed var(--accent);background:var(--accent-soft)}
.day-head{display:flex;justify-content:space-between;align-items:center}
.num{font-weight:800;font-size:14px}
.day.today .num{color:var(--accent-text)}
.add{width:22px;height:22px;border-radius:6px;border:1px solid var(--line);background:var(--card);color:var(--accent-text);cursor:pointer;line-height:1;font-size:15px}
.add:hover{border-color:var(--accent)}
.post{background:var(--card);border:1px solid var(--line);border-left:3px solid var(--muted);border-radius:7px;padding:6px 7px;cursor:grab;overflow:hidden}
.post:hover{border-color:var(--accent);box-shadow:var(--shadow)}
.post b{display:block;font-size:11.5px;font-weight:600;line-height:1.25;overflow-wrap:anywhere}
.post span{display:block;margin-top:3px;font-size:10px;color:var(--muted)}
.toolbar{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin:14px 0}.toolbar input,.toolbar select{border:1px solid var(--line);background:var(--surface);color:var(--ink);border-radius:9px;padding:9px;font:inherit}.bulk{display:flex;gap:8px;align-items:center;flex-wrap:wrap;padding:10px 12px;border:1px solid var(--line);border-radius:10px;background:var(--surface);margin:10px 0}.bulk strong{margin-right:auto}.post{position:relative;padding-left:27px}.post .pick{position:absolute;left:7px;top:8px;accent-color:var(--accent);width:14px;height:14px}.post.selected{outline:2px solid var(--accent)}.post span{overflow-wrap:anywhere}.empty{color:var(--muted);padding:24px;text-align:center}.hint{font-size:12px;color:var(--muted);margin:8px 0 14px}.modal{display:none;position:fixed;inset:0;background:rgba(0,0,0,.6);z-index:9;align-items:center;justify-content:center;padding:16px}
.modal.show{display:flex}
.dialog{background:var(--bg);color:var(--ink);border:1px solid var(--line);border-radius:14px;width:min(720px,100%);max-height:92vh;overflow:auto}
.dhead{display:flex;justify-content:space-between;align-items:center;padding:16px 20px;border-bottom:1px solid var(--line)}
.dhead h3{margin:0;font-size:18px}
.x{border:0;background:none;color:var(--muted);font-size:26px;cursor:pointer;line-height:1}
.form{padding:18px 20px;display:grid;grid-template-columns:1fr 1fr;gap:12px}
.full{grid-column:1/-1}
.f label{display:block;font-size:11px;text-transform:uppercase;letter-spacing:.8px;color:var(--muted);font-weight:700;margin-bottom:5px}
.f input,.f select,.f textarea{width:100%;border:1px solid var(--line);background:var(--surface);color:var(--ink);border-radius:8px;padding:9px;font:inherit}
.f input:focus,.f select:focus,.f textarea:focus{outline:none;border-color:var(--accent)}
.f textarea{min-height:76px;resize:vertical}
.nets{display:flex;gap:6px;flex-wrap:wrap}
.net{border:1px solid var(--line);background:var(--surface);color:var(--ink);border-radius:7px;padding:7px 11px;font:inherit;cursor:pointer}
.net.on{background:var(--accent);border-color:var(--accent);color:var(--on-accent);font-weight:800}
.dfoot{display:flex;gap:8px;padding:14px 20px;border-top:1px solid var(--line);flex-wrap:wrap}
.dfoot .sp{flex:1}
.hidden{display:none!important}
@media(max-width:760px){
  .weekdays{display:none}.grid{grid-template-columns:1fr}.day{min-height:auto}.day.empty-day{display:none}
  .form{grid-template-columns:1fr}.full{grid-column:auto}
}
</style>
</head>
<body>
<div class="wrap">
  <header class="top">
    <div class="brand">
      <div class="logo">M</div>
      <div><h1>Calendario Marketing</h1><small>Planificación y gestión de contenidos</small></div>
    </div>
    <div class="actions">
      <button class="btn" id="themeBtn" type="button">☀ Claro</button>
      <button class="btn" id="exportBtn" type="button">Exportar respaldo</button>
      <label class="btn" for="importFile">Importar / sincronizar</label>
      <input type="file" id="importFile" accept="application/json,.json" hidden>
      <button class="btn primary" id="newBtn" type="button">+ Nueva</button>
    </div>
  </header>

  <p class="hint">Sistema de planificación del área. Para trabajar desde dos equipos, exporten e importen el mismo respaldo JSON para mantener la información compartida.</p>
  <div class="toolbar">
    <input id="search" type="search" placeholder="Buscar publicaciones..." aria-label="Buscar publicaciones">
    <select id="filterStatus"><option value="">Todos los estados</option></select>
    <select id="filterNetwork"><option value="">Todas las redes</option></select>
    <select id="filterOwner"><option value="">Todas las responsables</option></select>
    <button class="btn" id="clearFilters" type="button">Limpiar filtros</button>
  </div>
  <div class="bulk">
    <strong><span id="selectedCount">0</span> seleccionadas</strong>
    <button class="btn" id="selectVisible" type="button">Seleccionar visibles</button>
    <button class="btn" id="unselectAll" type="button">Quitar selección</button>
    <button class="btn danger" id="deleteSelected" type="button" disabled>Eliminar seleccionadas</button>
    <button class="btn danger" id="clearAll" type="button">Clear all</button>
  </div>
  <div class="nav">
    <button class="btn" id="prevBtn" type="button">←</button>
    <h2 id="monthTitle"></h2>
    <button class="btn" id="nextBtn" type="button">→</button>
    <button class="btn" id="todayBtn" type="button">Hoy</button>
    <span class="count" id="count"></span>
  </div>
  <div class="weekdays"><span>Lun</span><span>Mar</span><span>Mié</span><span>Jue</span><span>Vie</span><span>Sáb</span><span>Dom</span></div>
  <div class="grid" id="grid"></div>
</div>

<div class="modal" id="modal">
  <div class="dialog">
    <div class="dhead"><h3 id="mTitle">Nueva publicación</h3><button class="x" id="closeBtn" type="button">&times;</button></div>
    <div class="form">
      <input type="hidden" id="postId">
      <div class="f full"><label>Título</label><input id="title"></div>
      <div class="f"><label>Fecha</label><input type="date" id="day"></div>
      <div class="f"><label>Hora</label><input type="time" id="time"></div>
      <div class="f"><label>Formato</label><select id="format"></select></div>
      <div class="f"><label>Estado</label><select id="status"></select></div>
      <div class="f"><label>Responsable</label><input id="owner" list="ownerOptions" placeholder="Nombre de quien gestiona"><datalist id="ownerOptions"><option value="Responsable 1"><option value="Responsable 2"></datalist></div>
      <div class="f"><label>Pilar de contenido</label><select id="pillar"><option value="">Seleccionar</option><option>Educativo</option><option>Comercial</option><option>Institucional</option><option>Entretenimiento</option><option>Comunidad</option></select></div>
      <div class="f"><label>Objetivo</label><select id="objective"><option value="">Seleccionar</option><option>Alcance</option><option>Interacción</option><option> leads / consultas</option><option>Tráfico</option><option> posicionamiento</option></select></div>
      <div class="f full"><label>Redes</label><div class="nets" id="nets"></div></div>
      <div class="f full"><label>Gancho</label><input id="hook"></div>
      <div class="f full"><label>Idea / concepto</label><textarea id="idea"></textarea></div>
      <div class="f full"><label>Referencia o enlace de diseño</label><input id="designLink" type="url" placeholder="https://..."></div>
      <div class="f full"><label>Guion</label><textarea id="script" style="min-height:110px"></textarea></div>
      <div class="f full"><label>Caption</label><textarea id="caption"></textarea></div>
      <div class="f"><label>Hashtags</label><input id="hashtags"></div>
      <div class="f"><label>CTA</label><input id="cta"></div>
      <div class="f full"><label>Notas</label><textarea id="notes"></textarea></div>
    </div>
    <div class="dfoot">
      <button class="btn danger hidden" id="delBtn" type="button">Eliminar</button>
      <button class="btn hidden" id="dupBtn" type="button">Duplicar</button>
      <span class="sp"></span>
      <button class="btn" id="cancelBtn" type="button">Cancelar</button>
      <button class="btn primary" id="saveBtn" type="button">Guardar</button>
    </div>
  </div>
</div>

<script>
(function(){
  "use strict";
  var KEY = "marketing-calendar-shared-v2", THEME_KEY = "marketing-calendar-theme-v2";
  var selected = new Set(), visibleIds = [];
  var mem = null;
  function get(k){ try{ var r = localStorage.getItem(k); return r ? JSON.parse(r) : null; }catch(e){ return k===KEY ? mem : null; } }
  function set(k,v){ try{ localStorage.setItem(k, JSON.stringify(v)); }catch(e){ if(k===KEY) mem = v; } }
  function pad(n){ return n<10?"0"+n:""+n; }
  function iso(d){ return d.getFullYear()+"-"+pad(d.getMonth()+1)+"-"+pad(d.getDate()); }
  function uid(){ return "p"+Date.now().toString(36)+Math.random().toString(36).slice(2,9); }
  function esc(s){ return String(s).replace(/[&<>"']/g,function(c){return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c];}); }
  function uniq(a){ var o=[]; a.forEach(function(x){ if(x && o.indexOf(x)<0) o.push(x); }); return o; }

  var STATUS = ["Idea","Borrador","En diseño","Programado","Publicado"];
  var SCOL = {"Idea":"#9b7be0","Borrador":"#8f8f8a","En diseño":"#e0a02e","Programado":"#4aa3e0","Publicado":"#7fbf2a"};
  var NETS = ["Instagram","TikTok","X","LinkedIn"];
  var FORMATS = ["Reel / video corto","Carrusel","Post estático","Historia","Video / Demo","Artículo"];

  /* ---- tema ---- */
  var theme = get(THEME_KEY) || "dark";
  function applyTheme(){
    document.documentElement.setAttribute("data-theme", theme);
    document.getElementById("themeBtn").textContent = theme==="dark" ? "☀ Claro" : "☾ Oscuro";
  }
  document.getElementById("themeBtn").addEventListener("click", function(){
    theme = theme==="dark" ? "light" : "dark"; set(THEME_KEY, theme); applyTheme();
  });
  applyTheme();

  /* ---- datos generales ---- */
  var state = get(KEY) || get("inklutch-calendar-v1") || {posts:[]};
  var cur = new Date(); cur.setDate(1);
  normalize();
  function normalize(){
    if(!state || !Array.isArray(state.posts)) state={posts:[]};
    var seen={};
    state.posts.forEach(function(p){
      if(!p.id || seen[p.id]) p.id=uid(); seen[p.id]=1;
      if(!Array.isArray(p.networks)) p.networks=[];
      if(!p.status) p.status="Idea";
      ["title","hook","idea","script","caption","hashtags","cta","notes","time","format","owner","pillar","objective","designLink"].forEach(function(k){if(p[k]==null)p[k]="";});
      if(!p.updatedAt) p.updatedAt=p.createdAt||new Date().toISOString();
    });
  }
  function posts(){return state.posts;}
  function save(){set(KEY,state);render();updateBulk();updateFilters();}
  function gotoFirst(){var d=posts().map(function(p){return p.day;}).filter(Boolean).sort()[0];cur=d?new Date(d+"T12:00:00"):new Date();cur.setDate(1);}
  gotoFirst();

  /* ---- calendario mensual ---- */
  var grid = document.getElementById("grid");
  function render(){
    var y = cur.getFullYear(), m = cur.getMonth();
    document.getElementById("monthTitle").textContent = cur.toLocaleDateString("es-PE",{month:"long",year:"numeric"});
    var first = new Date(y,m,1), offset = (first.getDay()+6)%7, days = new Date(y,m+1,0).getDate();
    var cells = Math.ceil((offset+days)/7)*7, todayISO = iso(new Date()), all = filteredPosts(), n = 0;
    visibleIds=[]; grid.innerHTML = "";
    for(var i=0;i<cells;i++){
      var d = new Date(y,m,1-offset+i), k = iso(d), inMonth = d.getMonth()===m;
      var list = all.filter(function(p){ return p.day===k; }).sort(function(a,b){ return (a.time||"99")<(b.time||"99")?-1:1; });
      if(inMonth) n += list.length;
      var cell = document.createElement("div");
      cell.className = "day"+(inMonth?"":" out")+(k===todayISO?" today":"")+(list.length?"":" empty-day");
      cell.dataset.day = k;
      var head = document.createElement("div"); head.className = "day-head";
      head.innerHTML = '<span class="num">'+d.getDate()+'</span>';
      var add = document.createElement("button"); add.type="button"; add.className="add"; add.textContent="+"; add.title="Añadir";
      add.addEventListener("click",(function(day){ return function(){ openModal({day:day,networks:[],status:"Idea"}); }; })(k));
      head.appendChild(add); cell.appendChild(head);
      list.forEach(function(p){
        visibleIds.push(p.id);
        var c = document.createElement("div"); c.className="post"+(selected.has(p.id)?" selected":""); c.draggable=true;
        c.style.borderLeftColor = SCOL[p.status] || "#8f8f8a";
        var pick=document.createElement("input"); pick.type="checkbox"; pick.className="pick"; pick.checked=selected.has(p.id); pick.title="Seleccionar para eliminar";
        pick.addEventListener("click",function(e){e.stopPropagation();if(pick.checked)selected.add(p.id);else selected.delete(p.id);c.classList.toggle("selected",pick.checked);updateBulk();});
        c.appendChild(pick);
        var t = document.createElement("b"); t.textContent = p.title || "(sin título)";
        var s = document.createElement("span");
        s.textContent = [p.time, (p.networks||[]).join(" · "), p.status, p.owner].filter(Boolean).join("  ·  ");
        c.appendChild(t); c.appendChild(s);
        c.addEventListener("click",function(){ openModal(p); });
        c.addEventListener("dragstart",function(e){ e.dataTransfer.setData("text/plain",p.id); });
        cell.appendChild(c);
      });
      cell.addEventListener("dragover",function(e){ e.preventDefault(); this.classList.add("dragover"); });
      cell.addEventListener("dragleave",function(){ this.classList.remove("dragover"); });
      cell.addEventListener("drop",function(e){
        e.preventDefault(); this.classList.remove("dragover");
        var id = e.dataTransfer.getData("text/plain");
        var p = state.posts.filter(function(x){ return x.id===id; })[0];
        if(p){ p.day = this.dataset.day; save(); }
      });
      grid.appendChild(cell);
    }
    document.getElementById("count").textContent = n+" publicación"+(n===1?"":"es")+" visibles este mes · "+all.length+" en total";
    updateBulk();
  }

  document.getElementById("prevBtn").addEventListener("click",function(){ cur.setMonth(cur.getMonth()-1); render(); });
  document.getElementById("nextBtn").addEventListener("click",function(){ cur.setMonth(cur.getMonth()+1); render(); });
  document.getElementById("todayBtn").addEventListener("click",function(){ cur = new Date(); cur.setDate(1); render(); });

  /* ---- modal ---- */
  var $ = function(id){ return document.getElementById(id); };
  var selNets = [];
  function fill(sel, list, val){
    var items = uniq(list.concat(val?[val]:[]));
    sel.innerHTML = items.map(function(x){ return "<option>"+esc(x)+"</option>"; }).join("");
    sel.value = val || items[0];
  }
  function drawNets(){
    var found = []; state.posts.forEach(function(p){ found = found.concat(p.networks||[]); });
    var list = uniq(NETS.concat(found, selNets));
    $("nets").innerHTML = list.map(function(n){
      return '<button type="button" class="net'+(selNets.indexOf(n)>=0?" on":"")+'" data-n="'+esc(n)+'">'+esc(n)+'</button>';
    }).join("");
  }
  $("nets").addEventListener("click",function(e){
    var b = e.target.closest(".net"); if(!b) return;
    var i = selNets.indexOf(b.dataset.n); if(i<0) selNets.push(b.dataset.n); else selNets.splice(i,1);
    drawNets();
  });
  function openModal(p){
    $("modal").classList.add("show");
    $("mTitle").textContent = p.id ? "Editar publicación" : "Nueva publicación";
    $("postId").value = p.id||"";
    $("title").value = p.title||""; $("day").value = p.day || iso(cur); $("time").value = p.time||"";
    var formats = uniq(FORMATS.concat(state.posts.map(function(x){ return x.format; })));
    var sts = uniq(STATUS.concat(state.posts.map(function(x){ return x.status; })));
    fill($("format"), formats, p.format || formats[0]);
    fill($("status"), sts, p.status || "Idea");
    ["hook","idea","script","caption","hashtags","cta","notes","owner","pillar","objective","designLink"].forEach(function(k){ $(k).value = p[k]||""; });
    selNets = (p.networks||[]).slice(); drawNets();
    $("delBtn").classList.toggle("hidden",!p.id); $("dupBtn").classList.toggle("hidden",!p.id);
    setTimeout(function(){ $("title").focus(); },30);
  }
  function closeModal(){ $("modal").classList.remove("show"); }
  $("newBtn").addEventListener("click",function(){ openModal({day:iso(cur),networks:[],status:"Idea"}); });
  $("closeBtn").addEventListener("click",closeModal);
  $("cancelBtn").addEventListener("click",closeModal);
  $("modal").addEventListener("click",function(e){ if(e.target===$("modal")) closeModal(); });
  document.addEventListener("keydown",function(e){ if(e.key==="Escape") closeModal(); });

  $("saveBtn").addEventListener("click",function(){
    if(!$("title").value.trim()){ $("title").focus(); return; }
    var id = $("postId").value;
    var orig = id ? state.posts.filter(function(x){ return x.id===id; })[0] : null;
    var base = orig || Object.assign({
      designer:"",owner:"",approved:"",scheduler:"Publicación manual",designLink:"",assets:"",link:"",
      checklist:[],learning:"",pillar:"",objective:"",campaign:"",design:"",
      metrics:{reach:"",likes:"",comments:"",saves:"",shares:"",clicks:""},createdAt:new Date().toISOString()
    });
    var post = Object.assign({}, base, {
      id: id || uid(), title: $("title").value.trim(), day: $("day").value || iso(cur), time: $("time").value,
      format: $("format").value, status: $("status").value, networks: selNets.slice(),
      hook:$("hook").value, idea:$("idea").value, script:$("script").value, caption:$("caption").value,
      hashtags:$("hashtags").value, cta:$("cta").value, notes:$("notes").value,
      owner:$("owner").value.trim(), pillar:$("pillar").value, objective:$("objective").value,
      designLink:$("designLink").value.trim(), updatedAt:new Date().toISOString()
    });
    var i = state.posts.findIndex(function(x){ return x.id===post.id; });
    if(i<0) state.posts.push(post); else state.posts[i] = post;
    closeModal(); save();
  });
  $("delBtn").addEventListener("click",function(){
    if(!confirm("¿Eliminar esta publicación?")) return;
    var id = $("postId").value;
    state.posts = state.posts.filter(function(p){ return p.id!==id; });
    closeModal(); save();
  });
  $("dupBtn").addEventListener("click",function(){
    var id = $("postId").value, o = state.posts.filter(function(p){ return p.id===id; })[0]; if(!o) return;
    var c = JSON.parse(JSON.stringify(o)); c.id = uid(); c.title = o.title+" (copia)";
    state.posts.push(c); closeModal(); save();
  });

  /* ---- filtros y acciones masivas ---- */
  function filteredPosts(){
    var q=$("search").value.trim().toLowerCase(), st=$("filterStatus").value, net=$("filterNetwork").value, own=$("filterOwner").value;
    return posts().filter(function(p){
      var hay=[p.title,p.hook,p.idea,p.script,p.caption,p.hashtags,p.cta,p.notes,p.owner,p.pillar,p.objective,(p.networks||[]).join(" ")].join(" ").toLowerCase();
      return (!q||hay.indexOf(q)>=0)&&(!st||p.status===st)&&(!net||(p.networks||[]).indexOf(net)>=0)&&(!own||p.owner===own);
    });
  }
  function updateBulk(){
    $("selectedCount").textContent=selected.size;
    $("deleteSelected").disabled=selected.size===0;
  }
  function updateFilters(){
    var oldS=$("filterStatus").value,oldN=$("filterNetwork").value,oldO=$("filterOwner").value;
    function opts(el,arr,old,first){el.innerHTML='<option value="">'+first+'</option>'+uniq(arr).sort().map(function(x){return '<option value="'+esc(x)+'">'+esc(x)+'</option>';}).join("");el.value=old;}
    opts($("filterStatus"),posts().map(function(p){return p.status;}),oldS,"Todos los estados");
    opts($("filterNetwork"),[].concat.apply([],posts().map(function(p){return p.networks||[];})),oldN,"Todas las redes");
    opts($("filterOwner"),posts().map(function(p){return p.owner;}),oldO,"Todas las responsables");
  }
  ["search","filterStatus","filterNetwork","filterOwner"].forEach(function(id){$(id).addEventListener(id==="search"?"input":"change",render);});
  $("clearFilters").addEventListener("click",function(){$("search").value="";$("filterStatus").value="";$("filterNetwork").value="";$("filterOwner").value="";render();});
  $("selectVisible").addEventListener("click",function(){visibleIds.forEach(function(id){selected.add(id);});render();});
  $("unselectAll").addEventListener("click",function(){selected.clear();render();});
  $("deleteSelected").addEventListener("click",function(){if(!selected.size)return;if(!confirm("¿Eliminar las "+selected.size+" publicaciones seleccionadas? Esta acción no se puede deshacer."))return;state.posts=state.posts.filter(function(p){return !selected.has(p.id);});selected.clear();save();});
  $("clearAll").addEventListener("click",function(){if(!posts().length){alert("No hay publicaciones para eliminar.");return;}if(!confirm("¿Eliminar TODAS las publicaciones del calendario? Esta acción no se puede deshacer. Exporta un respaldo antes si lo necesitas."))return;state.posts=[];selected.clear();save();});

  /* ---- respaldo ---- */
  $("exportBtn").addEventListener("click",function(){
    var a = document.createElement("a");
    a.href = URL.createObjectURL(new Blob([JSON.stringify(state,null,2)],{type:"application/json"}));
    a.download = "calendario-marketing-respaldo-"+iso(new Date())+".json";
    document.body.appendChild(a); a.click(); document.body.removeChild(a); URL.revokeObjectURL(a.href);
  });
  $("importFile").addEventListener("change",function(e){
    var f = e.target.files[0]; if(!f) return;
    var r = new FileReader();
    r.onload = function(){
      try{
        var data = JSON.parse(r.result);
        if(!data || !Array.isArray(data.posts)) throw new Error("x");
        var incoming=data.posts, map={}; state.posts.forEach(function(p){map[p.id]=p;});
        incoming.forEach(function(p){var old=map[p.id];if(!old || (p.updatedAt||p.createdAt||"")>(old.updatedAt||old.createdAt||""))map[p.id]=p;});
        state.posts=Object.keys(map).map(function(id){return map[id];}); normalize(); gotoFirst(); save();
        alert("Respaldo sincronizado. Se combinaron las publicaciones sin duplicar sus identificadores.");
      }catch(err){ alert("El archivo no tiene un formato válido."); }
      $("importFile").value = "";
    };
    r.readAsText(f);
  });

  updateFilters(); render();
})();
</script>
</body>
</html>
